name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform android

      - name: Generate Keystore
        working-directory: android/app
        run: keytool -genkey -v -keystore release.keystore -alias my-alias -keypass password -storepass password -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=StudyTracker, O=StudyTracker, C=IN"

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file=release.keystore -Pandroid.injected.signing.store.password=password -Pandroid.injected.signing.key.alias=my-alias -Pandroid.injected.signing.key.password=password

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
